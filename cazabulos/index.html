<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Operación Cazabulos · Entrenamiento del tema 1</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔎</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --cobalto:#1D3BB0; --cobalto-hondo:#152C86; --papel:#F5F7FF; --tinta:#0F1A4A; --tinta-suave:#4A557F;
  --senal:#FFD23F; --bulo:#D93A2F; --ok:#128A5B; --linea:rgba(255,255,255,.22);
  --display:"Bricolage Grotesque","Arial Black","Segoe UI",system-ui,sans-serif;
  --texto:"Atkinson Hyperlegible","Segoe UI",Verdana,system-ui,sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--cobalto);color:#fff;font-family:var(--texto);font-size:18px;line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.09) 1px,transparent 0);background-size:22px 22px}
button,input{font:inherit}
:focus-visible{outline:3px solid var(--senal);outline-offset:3px}

/* Barra superior */
.barra{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--linea);background:var(--cobalto-hondo)}
.marca{font-family:var(--display);font-weight:800;font-size:18px;line-height:1.1}
.marca small{display:block;font-family:var(--texto);font-weight:400;font-size:14px;opacity:.8}
.niveles{display:flex;gap:6px}
.niveles span{width:44px;height:10px;border-radius:5px;background:rgba(255,255,255,.2)}
.niveles span.hecho{background:var(--senal)}
.niveles span.actual{background:#fff}
.marcadores{display:flex;justify-content:flex-end;gap:18px;font-variant-numeric:tabular-nums}
.marcadores div{text-align:right;line-height:1.1}
.marcadores b{display:block;font-family:var(--display);font-weight:800;font-size:24px}
.marcadores small{font-size:13px;opacity:.8}
.reloj.poco b{color:var(--senal)}
.puntos b{color:var(--senal)}

main{max-width:760px;margin:0 auto;padding:28px 20px 120px}

/* Portada */
.portada h1{font-family:var(--display);font-weight:800;font-size:clamp(48px,9vw,92px);line-height:.92;letter-spacing:-.02em;margin:24px 0 12px}
.portada .sub{font-size:21px;max-width:34em;margin:0 0 28px}
.reglas{background:var(--cobalto-hondo);border:1px solid var(--linea);border-radius:14px;padding:18px 22px;margin:0 0 28px}
.reglas ul{margin:0;padding-left:20px}
.reglas li{margin:6px 0}
label.campo{display:block;font-weight:700;margin-bottom:8px}
.fila{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
input.texto{background:#fff;color:var(--tinta);border:3px solid transparent;border-radius:10px;padding:12px 14px;min-width:0;flex:1 1 260px;font-size:20px}
input.texto:focus{border-color:var(--senal);outline:none}
.apoyo-tag{display:inline-block;background:var(--senal);color:var(--tinta);font-weight:700;border-radius:999px;padding:2px 12px;font-size:15px}

/* Botones */
.btn{appearance:none;border:0;border-radius:10px;padding:13px 22px;font-weight:700;font-size:19px;cursor:pointer;background:var(--senal);color:var(--tinta)}
.btn:hover{filter:brightness(1.05)}
.btn.sec{background:transparent;color:#fff;border:2px solid var(--linea)}
.btn.sec:hover{border-color:#fff}
.btn:disabled{opacity:.5;cursor:default}

/* Tarjeta de expediente */
.ficha{position:relative;background:var(--papel);color:var(--tinta);border-radius:16px;padding:26px 28px 28px;box-shadow:0 18px 0 -8px var(--cobalto-hondo)}
.ficha .meta{display:flex;justify-content:space-between;gap:12px;color:var(--tinta-suave);font-size:15px;margin-bottom:14px}
.enunciado{font-size:21px;margin:0 0 20px}
.enunciado .big{display:block;font-family:var(--display);font-weight:800;font-size:clamp(28px,5vw,40px);line-height:1.2;margin-top:10px;overflow-x:auto;white-space:nowrap}
.enunciado sup,.res sup{font-size:.62em}
.respuesta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.respuesta input{background:#fff;color:var(--tinta);border:2px solid #B9C2E6;border-radius:10px;padding:10px 12px;font-size:22px;width:220px;font-variant-numeric:tabular-nums}
.respuesta input:focus{border-color:var(--cobalto);outline:none;box-shadow:0 0 0 3px rgba(29,59,176,.25)}
.respuesta input.mant{width:120px}
.respuesta input.exp{width:84px;font-size:18px;padding:6px 8px;transform:translateY(-16px)}
.respuesta .por{font-family:var(--display);font-weight:800;font-size:28px}
.respuesta .unidad{font-weight:700;font-size:20px}
.ayuda{color:var(--tinta-suave);font-size:15px;margin:4px 0 18px}
.opciones{display:grid;gap:10px;margin-bottom:6px}
.opcion{display:flex;gap:14px;align-items:center;text-align:left;background:#fff;color:var(--tinta);border:2px solid #B9C2E6;border-radius:12px;padding:12px 16px;font-size:20px;cursor:pointer}
.opcion:hover{border-color:var(--cobalto)}
.opcion kbd{font-family:var(--texto);font-size:14px;background:var(--papel);border:1px solid #B9C2E6;border-radius:6px;padding:1px 7px;color:var(--tinta-suave)}
.acciones{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.aviso{color:var(--bulo);font-weight:700;font-size:16px;min-height:1.5em;margin:6px 0 0}
.pista{background:#FFF4C7;border-radius:10px;padding:10px 14px;margin:0 0 14px;font-size:17px}

/* Barra de bonus de rapidez */
.bonus{margin:18px 0 0}
.bonus .pista-txt{display:flex;justify-content:space-between;font-size:14px;color:var(--tinta-suave);margin-bottom:4px}
.bonus .tubo{height:8px;background:#DDE2F5;border-radius:4px;overflow:hidden}
.bonus .nivel{height:100%;width:100%;background:var(--senal);transition:width .25s linear}

/* Sello */
.sello{position:absolute;top:18px;right:22px;font-family:var(--display);font-weight:800;font-size:clamp(28px,6vw,44px);letter-spacing:.06em;
  padding:4px 16px;border:5px solid currentColor;border-radius:10px;transform:rotate(-9deg);opacity:.92;pointer-events:none;
  animation:golpe .32s cubic-bezier(.2,1.6,.4,1) both}
.sello.ok{color:var(--ok)} .sello.mal{color:var(--bulo)}
@keyframes golpe{from{transform:rotate(-9deg) scale(1.9);opacity:0}to{transform:rotate(-9deg) scale(1);opacity:.92}}
.res h2{font-family:var(--display);font-weight:800;font-size:34px;margin:0 0 6px;max-width:70%}
.res .gana{font-family:var(--display);font-weight:800;font-size:22px;margin:0 0 16px}
.res .gana.neg{color:var(--bulo)}
.res .sol{background:#E8ECFB;border-radius:10px;padding:12px 16px;margin:0 0 18px;font-size:19px;overflow-x:auto}
.res .sol strong{display:block;font-size:15px;color:var(--tinta-suave);margin-bottom:2px}
.nota-grande{font-family:var(--display);font-weight:800;font-size:clamp(80px,16vw,140px);line-height:1;margin:6px 0 10px;font-variant-numeric:tabular-nums}
.datos{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:18px 0}
.datos div{background:#E8ECFB;border-radius:10px;padding:10px 12px}
.datos b{display:block;font-family:var(--display);font-size:24px}
.datos small{color:var(--tinta-suave);font-size:14px}
.codigo{width:100%;font-family:Consolas,"Courier New",monospace;font-size:17px;line-height:1.5;padding:12px;border:2px dashed var(--cobalto);border-radius:10px;background:#fff;color:var(--tinta);resize:none;word-break:break-all}
.titular{font-family:var(--display);font-weight:800;font-size:clamp(34px,6vw,52px);line-height:1;margin:0 0 12px}
.ficha p{margin:0 0 14px}

/* Pie y diálogos */
.pie{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 20px calc(10px + env(safe-area-inset-bottom,0px));background:var(--cobalto-hondo);border-top:1px solid var(--linea);font-size:15px}
.pie .salidas.alerta{color:var(--senal);font-weight:700}
.velo{position:fixed;inset:0;background:rgba(10,18,60,.6);display:grid;place-items:center;padding:20px;z-index:20}
.velo .ficha{max-width:460px}
.toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);background:var(--senal);color:var(--tinta);font-weight:700;border-radius:10px;padding:10px 18px;z-index:30;box-shadow:0 6px 0 rgba(0,0,0,.2)}
[hidden]{display:none!important}

.calc-btn{margin-left:auto;margin-right:12px;padding:9px 16px;font-size:16px}
.calc{position:absolute;right:16px;bottom:calc(100% + 10px);width:280px;max-width:calc(100vw - 32px);background:var(--papel);color:var(--tinta);border-radius:14px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:15}
.calc-cab{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px;margin-bottom:8px}
.calc-cab button{appearance:none;border:0;background:transparent;font-size:22px;line-height:1;cursor:pointer;color:var(--tinta);padding:2px 6px}
.calc-pant{background:#fff;border:2px solid #C9D0EC;border-radius:8px;padding:6px 10px;text-align:right;min-height:64px;margin-bottom:8px;overflow-x:auto}
.calc-expr{font-size:14px;color:var(--tinta-suave);min-height:20px;white-space:nowrap}
.calc-res{font-family:var(--display);font-weight:800;font-size:24px;white-space:nowrap}
.calc-res.err{color:var(--bulo);font-size:16px}
.calc-teclas{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc-teclas button{appearance:none;border:0;border-radius:8px;padding:10px 0;font-size:18px;font-weight:700;cursor:pointer;background:#E3E8F8;color:var(--tinta);font-family:var(--texto)}
.calc-teclas button.op{background:#C9D3F3}
.calc-teclas button.ig{background:var(--senal)}
.calc-teclas button.bor{background:#FBD9D6;color:#8A1F17}
.calc-teclas button:active{transform:translateY(1px)}
@media (max-width:700px){
  .barra{grid-template-columns:1fr auto;grid-template-areas:"m r" "n n"}
  .marca{grid-area:m}.marcadores{grid-area:r}.niveles{grid-area:n;justify-content:center}
  .ficha{padding:20px}
  .sello{top:10px;right:10px}
  .res h2{max-width:60%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="barra" id="barra" hidden>
  <div class="marca">Operación Cazabulos<small id="agente"></small></div>
  <div class="niveles" id="niveles" aria-label="Progreso de niveles"></div>
  <div class="marcadores">
    <div class="reloj" id="reloj"><b id="tiempo">50:00</b><small>quedan</small></div>
    <div class="puntos"><b id="puntos">0</b><small>puntos</small></div>
  </div>
</header>

<main id="app" aria-live="polite"></main>

<footer class="pie" id="pie" hidden>
  <span class="salidas" id="salidas">Salidas de la pantalla: 0</span>
  <button class="btn sec calc-btn" id="btnCalc" type="button" aria-expanded="false" aria-controls="calc">Calculadora</button>
  <button class="btn sec" id="btnTerminar" type="button">Terminar la misión</button>
  <div class="calc" id="calc" role="dialog" aria-label="Calculadora" tabindex="-1" hidden>
    <div class="calc-cab"><span>Calculadora</span><button type="button" id="calcX" aria-label="Cerrar calculadora">×</button></div>
    <div class="calc-pant" aria-live="polite"><div class="calc-expr" id="calcExpr"></div><div class="calc-res" id="calcRes">0</div></div>
    <div class="calc-teclas" id="calcTeclas">
      <button type="button" class="bor" data-k="C">C</button><button type="button" class="bor" data-k="B" aria-label="Borrar">⌫</button><button type="button" class="op" data-k="(">(</button><button type="button" class="op" data-k=")">)</button>
      <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button><button type="button" class="op" data-k="÷">÷</button>
      <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button><button type="button" class="op" data-k="×">×</button>
      <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button><button type="button" class="op" data-k="−">−</button>
      <button type="button" data-k="0">0</button><button type="button" data-k=",">,</button><button type="button" class="op" data-k="^">xʸ</button><button type="button" class="op" data-k="+">+</button>
      <button type="button" class="op" data-k="·10^" style="grid-column:span 2">·10ˣ</button><button type="button" class="ig" data-k="=" style="grid-column:span 2">=</button>
    </div>
  </div>
</footer>

<div class="velo" id="dialogo" hidden>
  <div class="ficha" role="dialog" aria-modal="true" aria-labelledby="dlgT">
    <h2 class="titular" id="dlgT" style="font-size:32px">¿Terminar ya?</h2>
    <p id="dlgP">Tu nota se calcula con lo que llevas hecho y ya no podrás seguir.</p>
    <div class="acciones">
      <button class="btn" id="dlgSi" type="button">Sí, terminar</button>
      <button class="btn sec" id="dlgNo" type="button" style="color:var(--tinta);border-color:#B9C2E6">Seguir jugando</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
